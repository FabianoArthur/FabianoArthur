<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" width="800" height="484" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How I ship with Claude Code</title>
<desc id="desc">You place an order: an idea or a bug report. The waiter, the main Claude Code session, takes the order and writes a task doc, then dispatches it to kitchens that cook in parallel, each one a tmux session with its own git worktree. Every kitchen's work passes the gates (tests, lint and build, a secret scan, and an independent review) and becomes a pull request with green CI. The loop closes with you: you review and merge.</desc>
